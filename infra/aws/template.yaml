AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  SyncBot - Slack app that syncs posts and replies across workspaces.
  DatabaseBackend mysql (default) or postgresql: TiDB / public SQL you already created.
  DatabaseBackend sqlite: /tmp SQLite + Litestream replica on S3 (reserved concurrency 1).
  This stack does not create RDS or a VPC. SAM deploy uses an S3 artifact bucket for packaging.

Globals:
  Function:
    Tracing: !If [XRayEnabled, Active, PassThrough]

# ================================================================
# Parameters
# ================================================================
# Grouping: Stage/backend → Slack → Database (app user) → app secrets → app settings.

Parameters:
  Stage:
    Description: Deployment stage
    Type: String
    Default: test
    AllowedValues:
      - test
      - prod

  DatabaseBackend:
    Description: >
      mysql (default) or postgresql = connect to a database you already created (TiDB, public MySQL, Postgres).
      sqlite = Lambda /tmp file + Litestream replica in S3. Empty DatabaseHost is an error unless sqlite.
    Type: String
    Default: mysql
    AllowedValues:
      - mysql
      - postgresql
      - sqlite

  EnableKeepWarm:
    Description: >
      EventBridge ScheduleV2 keep-warm (ENABLE_KEEP_WARM). Portable deploy knob, not app env.
      true = ENABLED, false = DISABLED. Default true.
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"

  # --- Slack ---

  SlackSigningSecret:
    Description: Slack signing secret for request verification (SLACK_SIGNING_SECRET)
    Type: String
    NoEcho: true

  SlackClientID:
    Description: >
      Slack OAuth app Client ID (SLACK_CLIENT_ID; Basic Information → App Credentials).
      Required for your Slack app; use the ID from the app you created for this deploy.
    Type: String

  SlackClientSecret:
    Description: Slack OAuth client secret (SLACK_CLIENT_SECRET)
    Type: String
    NoEcho: true

  SlackOauthBotScopes:
    Description: Comma-separated list of Slack OAuth bot scopes (SLACK_BOT_SCOPES)
    Type: String
    Default: "app_mentions:read,channels:history,channels:join,channels:read,channels:manage,chat:write,chat:write.customize,emoji:read,files:read,files:write,groups:history,groups:read,groups:write,im:write,reactions:read,reactions:write,team:read,usergroups:read,users:read,users:read.email"

  SlackOauthUserScopes:
    Description: >
      Comma-separated Slack OAuth user scopes (SLACK_USER_SCOPES). Must match slack-manifest.json
      oauth_config.scopes.user and syncbot/slack_manifest_scopes.py USER_SCOPES (same order).
    Type: String
    Default: "chat:write,channels:history,channels:read,files:read,files:write,groups:history,groups:read,groups:write,reactions:read,reactions:write,team:read,users:read,users:read.email"

  # --- Database: app credentials (mysql / postgresql) ---

  DatabaseUser:
    Description: >
      App database username (DATABASE_USER). Required when DatabaseBackend is mysql or postgresql.
      Use the full username (including any TiDB cluster prefix). Unused for sqlite.
    Type: String
    Default: ""

  DatabasePassword:
    Description: >
      App database password (DATABASE_PASSWORD). Required when DatabaseBackend is mysql or postgresql.
      Unused for sqlite.
    Type: String
    NoEcho: true
    Default: ""

  DataEncryptionKey:
    Description: >
      Passphrase for Fernet data-at-rest encryption (DATA_ENCRYPTION_KEY).
      Generate with: python3 -c "import secrets; print(secrets.token_urlsafe(36))"
    Type: String
    NoEcho: true

  DatabaseHost:
    Description: >
      Hostname of the database (DATABASE_HOST). Required when DatabaseBackend is mysql or postgresql.
      Unused for sqlite.
    Type: String
    Default: ""

  DatabasePort:
    Description: >
      TCP port for DatabaseHost (DATABASE_PORT). Leave empty to use engine default
      (3306 MySQL, 5432 PostgreSQL). Set for providers with a non-standard port (e.g. TiDB Cloud 4000).
      Unused for sqlite.
    Type: String
    Default: ""

  DatabaseSchema:
    Description: >
      Database/schema name for MySQL or PostgreSQL when DatabaseBackend is not sqlite.
      Each app sharing a DB instance should use a different schema name. Unused for sqlite.
    Type: String
    Default: "syncbot"

  # --- App settings ---

  LogLevel:
    Description: >
      Python logging level for the app (LOG_LEVEL). DEBUG, INFO, WARNING, ERROR, or CRITICAL.
    Type: String
    Default: INFO
    AllowedValues:
      - DEBUG
      - INFO
      - WARNING
      - ERROR
      - CRITICAL

  PrimaryWorkspace:
    Description: >
      Slack Team ID for PRIMARY_WORKSPACE. Required for backup/restore to appear; also scopes DB reset. Leave empty to hide backup/restore.
    Type: String
    Default: ""

  EnableDbReset:
    Description: >
      Set to "true" to enable Reset Database when PRIMARY_WORKSPACE matches (ENABLE_DB_RESET). Leave empty to disable.
      Legacy values (e.g. a Slack Team ID) are ignored by the app until updated to "true".
    Type: String
    Default: ""

  DatabaseTlsEnabled:
    Description: >
      Optional DATABASE_TLS_ENABLED. Empty = use app default (TLS on outside local dev).
      Set "true" or "false" to override. Unused for sqlite.
    Type: String
    Default: ""
    AllowedValues:
      - ""
      - "true"
      - "false"

  DatabaseSslCaPath:
    Description: >
      Optional CA bundle path when DB TLS is on (DATABASE_SSL_CA_PATH). Empty = app default.
      Unused for sqlite.
    Type: String
    Default: ""

  EnableXRay:
    Description: >
      Enable AWS X-Ray tracing on Lambda (extra cost beyond free tier).
      Set AWS_ENABLE_XRAY=true in deploy env to turn on.
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

# ================================================================
# Conditions
# ================================================================

Conditions:
  IsSqlite: !Equals [!Ref DatabaseBackend, sqlite]
  UseRemoteDatabase: !Not [!Equals [!Ref DatabaseBackend, sqlite]]
  IsMysqlEngine: !Equals [!Ref DatabaseBackend, mysql]
  UseRemoteDatabaseWithCustomPort: !And
    - !Condition UseRemoteDatabase
    - !Not [!Equals [!Ref DatabasePort, ""]]
  KeepWarmEnabled: !Equals [!Ref EnableKeepWarm, "true"]
  HasPrimaryWorkspace: !Not [!Equals [!Ref PrimaryWorkspace, ""]]
  HasEnableDbReset: !Equals [!Ref EnableDbReset, "true"]
  HasDatabaseTlsExplicit: !And
    - !Condition UseRemoteDatabase
    - !Not [!Equals [!Ref DatabaseTlsEnabled, ""]]
  HasDatabaseSslCaPath: !And
    - !Condition UseRemoteDatabase
    - !Not [!Equals [!Ref DatabaseSslCaPath, ""]]
  XRayEnabled: !Equals [!Ref EnableXRay, "true"]

Rules:
  RemoteRequiresHost:
    RuleCondition: !Not [!Equals [!Ref DatabaseBackend, sqlite]]
    Assertions:
      - Assert: !Not [!Equals [!Ref DatabaseHost, ""]]
        AssertDescription: DatabaseHost is required when DatabaseBackend is mysql or postgresql.
      - Assert: !Not [!Equals [!Ref DatabaseUser, ""]]
        AssertDescription: DatabaseUser is required when DatabaseBackend is mysql or postgresql.
      - Assert: !Not [!Equals [!Ref DatabasePassword, ""]]
        AssertDescription: DatabasePassword is required when DatabaseBackend is mysql or postgresql.

Mappings:
  StagesMap:
    test:
      KeepWarmName: "SyncBotKeepWarmTest"
    prod:
      KeepWarmName: "SyncBotKeepWarmProd"

Resources:
  # ============================================================
  # Litestream replica bucket (sqlite mode)
  # ============================================================

  LitestreamBucket:
    Type: AWS::S3::Bucket
    Condition: IsSqlite
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "syncbot-${Stage}-litestream-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: KeepLastFewVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
              NewerNoncurrentVersions: 3
            ExpiredObjectDeleteMarker: true
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  # ============================================================
  # Lambda Function
  # ============================================================

  SyncBotFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      cfn-lint:
        config:
          ignore_checks:
            - W1030
    Properties:
      FunctionUrlConfig:
        AuthType: NONE
      CodeUri: lambda/
      Handler: handler.handler
      Runtime: python3.12
      Architectures:
        - x86_64
      Timeout: 120
      MemorySize: 256
      ReservedConcurrentExecutions: !If [IsSqlite, 1, !Ref AWS::NoValue]
      Events:
        SyncBotKeepWarm:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "rate(5 minutes)"
            Name: !FindInMap
              - StagesMap
              - !Ref Stage
              - KeepWarmName
            State: !If [KeepWarmEnabled, ENABLED, DISABLED]
      Environment:
        Variables:
          SLACK_BOT_TOKEN: "123"
          SLACK_SIGNING_SECRET: !Ref SlackSigningSecret
          SLACK_CLIENT_SECRET: !Ref SlackClientSecret
          SLACK_BOT_SCOPES: !Ref SlackOauthBotScopes
          SLACK_USER_SCOPES: !Ref SlackOauthUserScopes
          SLACK_CLIENT_ID: !Ref SlackClientID
          DATABASE_BACKEND: !Ref DatabaseBackend
          DATABASE_URL: !If [IsSqlite, "sqlite:////tmp/syncbot.db", !Ref AWS::NoValue]
          LITESTREAM_S3_BUCKET: !If [IsSqlite, !Ref LitestreamBucket, !Ref AWS::NoValue]
          DATABASE_PORT: !If
            - UseRemoteDatabaseWithCustomPort
            - !Ref DatabasePort
            - !If
              - UseRemoteDatabase
              - !If
                - IsMysqlEngine
                - "3306"
                - "5432"
              - !Ref AWS::NoValue
          DATABASE_HOST: !If [UseRemoteDatabase, !Ref DatabaseHost, !Ref AWS::NoValue]
          DATABASE_USER: !If [UseRemoteDatabase, !Ref DatabaseUser, !Ref AWS::NoValue]
          DATABASE_PASSWORD: !If [UseRemoteDatabase, !Ref DatabasePassword, !Ref AWS::NoValue]
          DATABASE_SCHEMA: !If [UseRemoteDatabase, !Ref DatabaseSchema, !Ref AWS::NoValue]
          DATA_ENCRYPTION_KEY: !Ref DataEncryptionKey
          LOG_LEVEL: !Ref LogLevel
          PRIMARY_WORKSPACE: !If
            - HasPrimaryWorkspace
            - !Ref PrimaryWorkspace
            - !Ref AWS::NoValue
          ENABLE_DB_RESET: !If
            - HasEnableDbReset
            - "true"
            - !Ref AWS::NoValue
          DATABASE_TLS_ENABLED: !If
            - HasDatabaseTlsExplicit
            - !Ref DatabaseTlsEnabled
            - !Ref AWS::NoValue
          DATABASE_SSL_CA_PATH: !If
            - HasDatabaseSslCaPath
            - !Ref DatabaseSslCaPath
            - !Ref AWS::NoValue

  # Slack Bolt (aws_lambda adapter) runs lazy listeners by invoking this function again
  # via lambda:InvokeFunction. The execution role must allow self-invoke.
  SyncBotFunctionSelfInvokePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "syncbot-${Stage}-self-invoke"
      Roles:
        - !Ref SyncBotFunctionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowSelfInvokeForBoltLazyListeners
            Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource: !GetAtt SyncBotFunction.Arn

  SyncBotLitestreamS3Policy:
    Type: AWS::IAM::Policy
    Condition: IsSqlite
    Properties:
      PolicyName: !Sub "syncbot-${Stage}-litestream-s3"
      Roles:
        - !Ref SyncBotFunctionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: LitestreamListBucket
            Effect: Allow
            Action:
              - s3:ListBucket
            Resource: !GetAtt LitestreamBucket.Arn
          - Sid: LitestreamObjects
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
            Resource: !Sub "${LitestreamBucket.Arn}/*"

  # ============================================================
  # CloudWatch Logs and Alarms
  # ============================================================

  SyncBotLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${SyncBotFunction}"
      RetentionInDays: 30

  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "syncbot-${Stage}-lambda-errors"
      AlarmDescription: >
        Fires when the SyncBot Lambda function produces 3 or more
        errors within a 5-minute window.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref SyncBotFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  LambdaThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "syncbot-${Stage}-lambda-throttles"
      AlarmDescription: >
        Fires when the SyncBot Lambda function is throttled.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref SyncBotFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  LambdaDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "syncbot-${Stage}-lambda-duration"
      AlarmDescription: >
        Fires when average Lambda duration exceeds 10 seconds.
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref SyncBotFunction
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 10000
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

# ================================================================
# Outputs
# ================================================================

Outputs:
  SyncBotPublicBaseUrl:
    Description: Public HTTPS base URL (Lambda Function URL)
    Value: !GetAtt SyncBotFunctionUrl.FunctionUrl

  SyncBotApiUrl:
    Description: Lambda Function URL endpoint for Slack events
    Value: !Sub "${SyncBotFunctionUrl.FunctionUrl}slack/events"

  SyncBotInstallUrl:
    Description: Slack app installation URL
    Value: !Sub "${SyncBotFunctionUrl.FunctionUrl}slack/install"

  SyncBotFunctionArn:
    Description: SyncBot Lambda function ARN
    Value: !GetAtt SyncBotFunction.Arn

  DatabaseHostInUse:
    Description: Database host the Lambda is configured to connect to (or sqlite for Litestream mode)
    Value: !If
      - IsSqlite
      - sqlite
      - !Ref DatabaseHost

  LitestreamBucketName:
    Condition: IsSqlite
    Description: S3 bucket for Litestream SQLite replica
    Value: !Ref LitestreamBucket
