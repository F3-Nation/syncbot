# Bootstrap stack for SyncBot deployments.
# Deploy once with admin credentials; creates OIDC role, deploy bucket, and
# least-privilege policy for GitHub Actions and optional local deploy use.
# No SAM Transform — plain CloudFormation (IAM + S3).
AWSTemplateFormatVersion: "2010-09-09"
Description: >
  SyncBot bootstrap: GitHub OIDC deploy role, deployment artifact bucket,
  and least-privilege policy. Deploy once locally, then use outputs in GitHub
  and for future local deploys.

Parameters:
  GitHubRepository:
    Type: String
    Description: >
      GitHub repository in form owner/repo (e.g. myorg/syncbot).
      Used to scope OIDC trust so only this repo can assume the deploy role.
  GitHubImmutableRepository:
    Type: String
    Default: ""
    Description: >
      Optional second form of the same repository, owner@owner-id/repo@repo-id
      (e.g. myorg@12345678/syncbot@9876543210). GitHub issues this immutable
      subject claim instead of owner/repo for repositories created or transferred
      after 2026-07-15, and the plain owner/repo pattern never matches those
      tokens. ensure_bootstrap.sh fills this in automatically; to read it yourself
      run: gh api repos/OWNER/REPO/actions/oidc/customization/sub --jq .sub_claim_prefix
      and drop the leading "repo:". Leave empty to trust only owner/repo.
  CreateOIDCProvider:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: >
      Set to false if an OIDC provider for token.actions.githubusercontent.com
      already exists in this account (e.g. created by another stack).
  DeploymentBucketPrefix:
    Type: String
    Default: "syncbot-deploy"
    Description: >
      Prefix for the deployment artifact bucket. The bucket resource name is
      DeploymentBucketPrefix + account ID + region (see DeploymentBucket in Resources).
  TemplateContentSha256:
    Type: String
    Default: ""
    Description: >
      sha256 of infra/aws/template.bootstrap.yaml. Set by ensure_bootstrap.sh so
      later deploys skip CloudFormation when the file is unchanged. Do not set by hand.

Conditions:
  CreateOIDC: !Equals [!Ref CreateOIDCProvider, "true"]
  HasImmutableRepository: !Not [!Equals [!Ref GitHubImmutableRepository, ""]]

Resources:
  # -------------------------------------------------------------------------
  # GitHub OIDC identity provider (one per account)
  # -------------------------------------------------------------------------
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOIDC
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  # -------------------------------------------------------------------------
  # Deployment artifact bucket for SAM/CloudFormation packages
  # -------------------------------------------------------------------------
  DeploymentBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${DeploymentBucketPrefix}-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldArtifacts
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 7

  # -------------------------------------------------------------------------
  # IAM role for GitHub Actions (and optional local assume-role)
  # -------------------------------------------------------------------------
  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "syncbot-github-deploy-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOIDC
                - !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
                - !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !If
                  - HasImmutableRepository
                  - - !Sub "repo:${GitHubRepository}:*"
                    - !Sub "repo:${GitHubImmutableRepository}:*"
                  - !Sub "repo:${GitHubRepository}:*"
      ManagedPolicyArns:
        - !Ref DeployPolicy

  # -------------------------------------------------------------------------
  # Least-privilege policy for SAM deploy (CloudFormation, S3, IAM PassRole, etc.)
  # -------------------------------------------------------------------------
  DeployPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "syncbot-deploy-policy-${AWS::Region}"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFormation
            Effect: Allow
            Action:
              - cloudformation:CreateStack
              - cloudformation:UpdateStack
              - cloudformation:DeleteStack
              - cloudformation:CreateChangeSet
              - cloudformation:ExecuteChangeSet
              - cloudformation:DeleteChangeSet
              - cloudformation:DescribeChangeSet
              - cloudformation:ListChangeSets
              - cloudformation:DescribeStacks
              - cloudformation:DescribeStackEvents
              - cloudformation:DescribeStackResources
              - cloudformation:DescribeStackResource
              - cloudformation:GetTemplate
              - cloudformation:GetTemplateSummary
              - cloudformation:ListStackResources
              - cloudformation:ValidateTemplate
            Resource: "*"
          - Sid: S3DeployBucket
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
              - s3:ListBucket
              - s3:GetBucketLocation
            Resource:
              - !GetAtt DeploymentBucket.Arn
              - !Sub "${DeploymentBucket.Arn}/*"
          - Sid: IAMCreateSyncBotRole
            Effect: Allow
            Action:
              - iam:CreateRole
            Resource: "*"
            Condition:
              StringLike:
                iam:RoleName: syncbot-*
          - Sid: IAMManageSyncBotRoles
            Effect: Allow
            Action:
              - iam:PassRole
              - iam:PutRolePolicy
              - iam:AttachRolePolicy
              - iam:GetRole
              - iam:DeleteRole
              - iam:DeleteRolePolicy
              - iam:DetachRolePolicy
            Resource:
              - !Sub "arn:aws:iam::${AWS::AccountId}:role/syncbot-*"
          - Sid: Lambda
            Effect: Allow
            Action:
              - lambda:CreateFunction
              - lambda:UpdateFunctionCode
              - lambda:UpdateFunctionConfiguration
              - lambda:GetFunction
              - lambda:DeleteFunction
              - lambda:AddPermission
              - lambda:RemovePermission
              - lambda:PublishVersion
              - lambda:InvokeFunction
              - lambda:PutFunctionConcurrency
              - lambda:DeleteFunctionConcurrency
              - lambda:GetFunctionConcurrency
            Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:syncbot-*"
          - Sid: LambdaFunctionUrl
            Effect: Allow
            Action:
              - lambda:CreateFunctionUrlConfig
              - lambda:UpdateFunctionUrlConfig
              - lambda:DeleteFunctionUrlConfig
              - lambda:GetFunctionUrlConfig
            Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:syncbot-*"
          - Sid: Logs
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:PutRetentionPolicy
              - logs:DescribeLogGroups
              - logs:DeleteLogGroup
            Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/syncbot-*"
          - Sid: LitestreamReplicaBucket
            Effect: Allow
            Action:
              - s3:CreateBucket
              - s3:DeleteBucket
              - s3:GetBucketLocation
              - s3:GetBucketPolicy
              - s3:PutBucketPolicy
              - s3:DeleteBucketPolicy
              - s3:GetBucketVersioning
              - s3:PutBucketVersioning
              - s3:GetLifecycleConfiguration
              - s3:PutLifecycleConfiguration
              - s3:GetBucketPublicAccessBlock
              - s3:PutBucketPublicAccessBlock
              - s3:GetEncryptionConfiguration
              - s3:PutEncryptionConfiguration
              - s3:GetBucketTagging
              - s3:PutBucketTagging
              - s3:ListBucket
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
            Resource:
              - "arn:aws:s3:::syncbot-*-litestream-*"
              - "arn:aws:s3:::syncbot-*-litestream-*/*"
          - Sid: CloudWatchAlarms
            Effect: Allow
            Action:
              - cloudwatch:PutMetricAlarm
              - cloudwatch:DeleteAlarms
              - cloudwatch:DescribeAlarms
            Resource: "*"
          - Sid: Events
            Effect: Allow
            Action:
              - events:PutRule
              - events:DeleteRule
              - events:PutTargets
              - events:RemoveTargets
              - events:DescribeRule
              - events:ListTargetsByRule
            Resource: "*"
          - Sid: Scheduler
            Effect: Allow
            Action:
              - scheduler:CreateSchedule
              - scheduler:UpdateSchedule
              - scheduler:DeleteSchedule
              - scheduler:GetSchedule
              - scheduler:ListSchedules
              - scheduler:CreateScheduleGroup
              - scheduler:GetScheduleGroup
            Resource: "*"
          - Sid: IAMManageSyncBotPolicies
            Effect: Allow
            Action:
              - iam:CreatePolicy
              - iam:GetPolicy
              - iam:DeletePolicy
              - iam:CreatePolicyVersion
              - iam:DeletePolicyVersion
              - iam:ListPolicyVersions
              - iam:GetPolicyVersion
            Resource:
              - !Sub "arn:aws:iam::${AWS::AccountId}:policy/syncbot-*"

Outputs:
  GitHubDeployRoleArn:
    Description: ARN of the role for GitHub Actions to assume (set as AWS_ROLE_TO_ASSUME).
    Value: !GetAtt GitHubDeployRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-GitHubDeployRoleArn"
  DeploymentBucketName:
    Description: Name of the S3 bucket for SAM deploy artifacts (set as AWS_S3_BUCKET).
    Value: !Ref DeploymentBucket
    Export:
      Name: !Sub "${AWS::StackName}-DeploymentBucketName"
  BootstrapRegion:
    Description: Region where bootstrap and app stacks are deployed.
    Value: !Ref AWS::Region
    Export:
      Name: !Sub "${AWS::StackName}-BootstrapRegion"
  SuggestedTestStackName:
    Description: Suggested stack name for test environment.
    Value: syncbot-test
  SuggestedProdStackName:
    Description: Suggested stack name for prod environment.
    Value: syncbot-prod
  BootstrapTemplateSha256:
    Description: sha256 of template.bootstrap.yaml from the last bootstrap deploy.
    Value: !Ref TemplateContentSha256
