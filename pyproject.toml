[tool.poetry]
name = "syncbot"
version = "1.5.4"
description = "Sync chat threads between Slack Workspaces."
authors = ["Evan Petzoldt <evan.petzoldt@protonmail.com>", "Klint Van Tassel <developer@sprocktech.com>"]
readme = "README.md"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[tool.poetry.dependencies]
python = "^3.12"
alembic = "^1.13"
python-dotenv = "^1.2.0"
slack-bolt = "^1.27.0"
sqlalchemy = "^2.0"
pymysql = "^1.1.2"
psycopg2-binary = "^2.9"
cryptography = "^50.0.0"
requests = "^2.32.0"


[tool.poetry.group.dev.dependencies]
boto3 = "^1.28.57"
pytest = "^9.0"

[tool.pytest.ini_options]
testpaths = ["tests", "infra/aws/tests", "infra/gcp/tests"]
pythonpath = ["syncbot", "infra/aws/lambda"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["syncbot", "tests", "infra/aws/tests", "infra/gcp/tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "LOG",  # flake8-logging
]
ignore = [
    "E501",   # line-too-long (handled by formatter)
    "B905",   # zip-without-explicit-strict
    "SIM108", # ternary operator (readability preference)
]

[tool.ruff.lint.per-file-ignores]
"syncbot/app.py" = ["E402"]  # load_dotenv() must run before app imports
"syncbot/builders/user_mapping.py" = ["I001"]  # import block sort (slack.blocks shorthand used)

[tool.ruff.lint.isort]
known-first-party = ["builders", "constants", "db", "federation", "handlers", "helpers", "logger", "routing", "slack"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.semantic_release]
version_toml = ["pyproject.toml:tool.poetry.version"]
commit_message = "chore(release): {version} [skip ci]"
tag_format = "{version}"
major_on_zero = false
build_command = ""

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.changelog]
mode = "update"
insertion_flag = "<!-- version list -->"
template_dir = ".github/semantic-release/templates"
exclude_commit_patterns = [
    "^chore",
    "^ci(?:\\(|:)",
    "^docs(?:\\(|:)",
    "^test(?:\\(|:)",
    "^style(?:\\(|:)",
    "^build(?:\\(|:)",
    "^refactor(?:\\(|:)",
    "^Merge ",
]

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "perf", "refactor", "docs", "build", "chore", "ci", "test", "style"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
