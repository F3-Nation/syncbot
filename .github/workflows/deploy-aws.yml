# Deploy SyncBot to AWS (SAM). See docs/DEPLOY.md and docs/INFRA_CONTRACT.md.
# To use GCP instead: set repository variable GITHUB_DEPLOY_TARGET=gcp and disable this workflow.
#
# Secrets are passed as SAM parameters with NoEcho.

name: Deploy (AWS)

on:
  push:
    branches:
      - test
      - prod
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - test
          - prod

concurrency:
  group: deploy-${{ github.event.inputs.environment || github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

# Skip when using GCP (set GITHUB_DEPLOY_TARGET=gcp to use deploy-gcp.yml instead)
jobs:
  sam-build:
    if: (vars.GITHUB_DEPLOY_TARGET || vars.DEPLOY_TARGET) != 'gcp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
          version: "1.165.0"

      - name: Validate SAM templates (cfn-lint)
        run: |
          sam validate -t infra/aws/template.yaml --lint
          sam validate -t infra/aws/template.bootstrap.yaml --lint

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - run: sam build -t infra/aws/template.yaml --build-in-source

      - name: Publish artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-artifact
          path: |
            ./.aws-sam/build
            ./infra/aws/template.bootstrap.yaml

  sam-deploy-test:
    if: (github.ref == 'refs/heads/test') || (github.event.inputs.environment == 'test')
    runs-on: ubuntu-latest
    environment: test
    needs: sam-build
    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: build-artifact
          path: '.'

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
          version: "1.165.0"

      - name: Ensure bootstrap stack
        env:
          AWS_BOOTSTRAP_STACK_NAME: ${{ vars.AWS_BOOTSTRAP_STACK_NAME || vars.BOOTSTRAP_STACK_NAME || 'syncbot-bootstrap' }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: bash infra/aws/scripts/ensure_bootstrap.sh

      - name: Deploy to test
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
          AWS_STACK_NAME: ${{ vars.AWS_STACK_NAME || 'syncbot-test' }}
          AWS_BOOTSTRAP_STACK_NAME: ${{ vars.AWS_BOOTSTRAP_STACK_NAME || vars.BOOTSTRAP_STACK_NAME || 'syncbot-bootstrap' }}
          STAGE_NAME: test
          DATABASE_BACKEND: ${{ vars.DATABASE_BACKEND }}
          AWS_DATABASE_MODE: ${{ vars.AWS_DATABASE_MODE }}
          ENABLE_KEEP_WARM: ${{ vars.ENABLE_KEEP_WARM || 'true' }}
          DATABASE_ENGINE: ${{ vars.DATABASE_ENGINE }}
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_USER: ${{ vars.DATABASE_USER }}
          DATABASE_HOST: ${{ vars.DATABASE_HOST }}
          DATABASE_PORT: ${{ vars.DATABASE_PORT }}
          DATABASE_SCHEMA: ${{ vars.DATABASE_SCHEMA }}
          DATABASE_TLS_ENABLED: ${{ vars.DATABASE_TLS_ENABLED }}
          DATABASE_SSL_CA_PATH: ${{ vars.DATABASE_SSL_CA_PATH }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL || 'INFO' }}
          PRIMARY_WORKSPACE: ${{ vars.PRIMARY_WORKSPACE }}
          ENABLE_DB_RESET: ${{ vars.ENABLE_DB_RESET }}
          AWS_ENABLE_XRAY: ${{ vars.AWS_ENABLE_XRAY || vars.ENABLE_XRAY || 'false' }}
          SLACK_CLIENT_ID: ${{ vars.SLACK_CLIENT_ID }}
          SLACK_CLIENT_SECRET: ${{ secrets.SLACK_CLIENT_SECRET }}
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
        run: bash infra/aws/scripts/ci_sam_deploy_with_fallback.sh

      - name: Run migrations and warm up Lambda
        run: |
          FUNCTION_ARN=$(aws cloudformation describe-stacks \
            --stack-name ${{ vars.AWS_STACK_NAME || 'syncbot-test' }} \
            --query "Stacks[0].Outputs[?OutputKey=='SyncBotFunctionArn'].OutputValue" \
            --output text)
          bash infra/aws/scripts/invoke_lambda_migrate.sh "$FUNCTION_ARN"

      - name: Post-deploy summary
        run: |
          STACK=${{ vars.AWS_STACK_NAME || 'syncbot-test' }}
          API_URL=$(aws cloudformation describe-stacks --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='SyncBotApiUrl'].OutputValue" --output text)
          INSTALL_URL=$(aws cloudformation describe-stacks --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='SyncBotInstallUrl'].OutputValue" --output text)
          OAUTH_URL="${API_URL%/slack/events}/slack/oauth_redirect"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## SyncBot Deploy (test)
          - **Stack**: $STACK
          - **API URL**: $API_URL
          - **Install URL**: $INSTALL_URL
          - **OAuth Redirect URL**: $OAUTH_URL
          EOF

  sam-deploy-prod:
    if: (github.ref == 'refs/heads/prod') || (github.event.inputs.environment == 'prod')
    runs-on: ubuntu-latest
    environment: prod
    needs: sam-build
    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: build-artifact
          path: '.'

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
          version: "1.165.0"

      - name: Ensure bootstrap stack
        env:
          AWS_BOOTSTRAP_STACK_NAME: ${{ vars.AWS_BOOTSTRAP_STACK_NAME || vars.BOOTSTRAP_STACK_NAME || 'syncbot-bootstrap' }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: bash infra/aws/scripts/ensure_bootstrap.sh

      - name: Deploy to prod
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
          AWS_STACK_NAME: ${{ vars.AWS_STACK_NAME || 'syncbot-prod' }}
          AWS_BOOTSTRAP_STACK_NAME: ${{ vars.AWS_BOOTSTRAP_STACK_NAME || vars.BOOTSTRAP_STACK_NAME || 'syncbot-bootstrap' }}
          STAGE_NAME: prod
          DATABASE_BACKEND: ${{ vars.DATABASE_BACKEND }}
          AWS_DATABASE_MODE: ${{ vars.AWS_DATABASE_MODE }}
          ENABLE_KEEP_WARM: ${{ vars.ENABLE_KEEP_WARM || 'true' }}
          DATABASE_ENGINE: ${{ vars.DATABASE_ENGINE }}
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_USER: ${{ vars.DATABASE_USER }}
          DATABASE_HOST: ${{ vars.DATABASE_HOST }}
          DATABASE_PORT: ${{ vars.DATABASE_PORT }}
          DATABASE_SCHEMA: ${{ vars.DATABASE_SCHEMA }}
          DATABASE_TLS_ENABLED: ${{ vars.DATABASE_TLS_ENABLED }}
          DATABASE_SSL_CA_PATH: ${{ vars.DATABASE_SSL_CA_PATH }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL || 'INFO' }}
          PRIMARY_WORKSPACE: ${{ vars.PRIMARY_WORKSPACE }}
          ENABLE_DB_RESET: ${{ vars.ENABLE_DB_RESET }}
          AWS_ENABLE_XRAY: ${{ vars.AWS_ENABLE_XRAY || vars.ENABLE_XRAY || 'false' }}
          SLACK_CLIENT_ID: ${{ vars.SLACK_CLIENT_ID }}
          SLACK_CLIENT_SECRET: ${{ secrets.SLACK_CLIENT_SECRET }}
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
        run: bash infra/aws/scripts/ci_sam_deploy_with_fallback.sh

      - name: Run migrations and warm up Lambda
        run: |
          FUNCTION_ARN=$(aws cloudformation describe-stacks \
            --stack-name ${{ vars.AWS_STACK_NAME || 'syncbot-prod' }} \
            --query "Stacks[0].Outputs[?OutputKey=='SyncBotFunctionArn'].OutputValue" \
            --output text)
          bash infra/aws/scripts/invoke_lambda_migrate.sh "$FUNCTION_ARN"

      - name: Post-deploy summary
        run: |
          STACK=${{ vars.AWS_STACK_NAME || 'syncbot-prod' }}
          API_URL=$(aws cloudformation describe-stacks --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='SyncBotApiUrl'].OutputValue" --output text)
          INSTALL_URL=$(aws cloudformation describe-stacks --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='SyncBotInstallUrl'].OutputValue" --output text)
          OAUTH_URL="${API_URL%/slack/events}/slack/oauth_redirect"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## SyncBot Deploy (prod)
          - **Stack**: $STACK
          - **API URL**: $API_URL
          - **Install URL**: $INSTALL_URL
          - **OAuth Redirect URL**: $OAUTH_URL
          EOF
