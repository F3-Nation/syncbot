# Automated semver releases via python-semantic-release. Commits/tags/releases use the
# GitHub git API as f3n-community-automation (GitHub App) so they are Verified and can
# bypass the main ruleset. GITHUB_TOKEN cannot updateRef on a PR-required branch.
# Runs only on F3Nation-Community/slack-syncbot — forks must not mint a second release stream.
# See docs/DEVELOPMENT.md — Releases & Versioning.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  semantic-release:
    if: >-
      github.repository == 'F3Nation-Community/slack-syncbot' &&
      github.ref == 'refs/heads/main' && (
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       !startsWith(github.event.head_commit.message, 'chore(release):') &&
       !startsWith(github.event.head_commit.message, 'chore: sync requirements'))
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # Run PSR on the runner so we can pin GitPython. The official Docker action
      # rebuilds its image at job time and pulls GitPython 3.1.60, which removed
      # Actor.name_email_regex (python-semantic-release/python-semantic-release#1476).
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install python-semantic-release
        run: |
          python -m pip install --upgrade pip
          pip install "python-semantic-release==9.21.2" "gitpython>=3.0,<3.1.60"

      - id: psr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release version --no-commit --no-tag --no-push --no-vcs-release --changelog --skip-build

      - name: Mint GitHub App token
        if: steps.psr.outputs.released == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          owner: F3Nation-Community
          repositories: slack-syncbot

      - name: Commit, tag, and publish release (GitHub API)
        if: ${{ steps.psr.outputs.released == 'true' }}
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.psr.outputs.version }}
          TAG: ${{ steps.psr.outputs.tag }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const version = process.env.VERSION;
            const tag = process.env.TAG || version;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.ref.replace('refs/heads/', '');
            const parentSha = context.sha;

            const pyproject = fs.readFileSync('pyproject.toml', 'utf8');
            const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');

            function notesFromChangelog(md, ver) {
              // GitHub Release body is this CHANGELOG section (Keep a Changelog, no version heading).
              const v = String(ver || '').replace(/^v/, '');
              const prefixes = [`## [${v}]`, `## v${v}`, `## ${v} `];
              const lines = md.split('\n');
              let start = -1;
              for (let i = 0; i < lines.length; i++) {
                if (prefixes.some((p) => lines[i].startsWith(p))) { start = i; break; }
              }
              if (start < 0) return '';
              let end = lines.length;
              for (let i = start + 1; i < lines.length; i++) {
                if (lines[i].startsWith('## ')) { end = i; break; }
              }
              return lines.slice(start + 1, end).join('\n').trim();
            }
            let notes = notesFromChangelog(changelog, version);
            if (!notes) {
              notes = `Release ${version}`;
            }

            const { data: parentCommit } = await github.rest.git.getCommit({
              owner,
              repo,
              commit_sha: parentSha,
            });

            const { data: tree } = await github.rest.git.createTree({
              owner,
              repo,
              base_tree: parentCommit.tree.sha,
              tree: [
                { path: 'pyproject.toml', mode: '100644', type: 'blob', content: pyproject },
                { path: 'CHANGELOG.md', mode: '100644', type: 'blob', content: changelog },
              ],
            });

            const message = [
              `chore(release): ${version} [skip ci]`,
              '',
              'Automated release by python-semantic-release.',
            ].join('\n');

            const { data: commit } = await github.rest.git.createCommit({
              owner,
              repo,
              message,
              tree: tree.sha,
              parents: [parentSha],
            });

            await github.rest.git.updateRef({
              owner,
              repo,
              ref: `heads/${branch}`,
              sha: commit.sha,
            });

            try {
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/tags/${tag}`,
                sha: commit.sha,
              });
            } catch (e) {
              core.warning(`Tag ${tag} may already exist: ${e}`);
            }

            await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              name: tag,
              body: notes,
            });
